# Local development configuration, mounted at /etc/eodh/accounting.conf.
#
# This is the inner document only. The production equivalent lives inside a
# Kubernetes ConfigMap in eodhp-argocd-deployment, under data."accounting.conf".
# Mounting that file as-is gives a document with a top-level 'data' key, which
# the loader now rejects outright rather than loading and configuring nothing.

items:
  - sku: cpu-seconds
    name: Notebook and workflow CPU time
    unit: "s"
  - sku: memory-gb-seconds
    name: Notebook and workflow memory
    unit: "GB-s"
  - sku: EFS-STORAGE-STD
    name: Standard block storage
    unit: "GB-s"
  - sku: AWS-S3-STORAGE
    name: Standard object storage
    unit: "GB-s"
  - sku: AWS-S3-API-CALLS
    name: Object store S3 API calls
    unit: "requests"
  - sku: AWS-S3-DATA-TRANSFER-OUT-REGION
    name: Object store S3 data transfer to AWS eu-west-2
    unit: "GB"
  - sku: AWS-S3-DATA-TRANSFER-OUT-INTERREGION
    name: Object store S3 data transfer to other AWS regions
    unit: "GB"
  - sku: AWS-S3-DATA-TRANSFER-OUT-INTERNET
    name: Object store S3 data transfer to the Internet
    unit: "GB"

# One calibration pass (D3): every credit rate and every category multiplier
# together. Loaded mint-or-match, so restarting the ingester with this file
# unchanged writes nothing, and only a change to a rate, a multiplier, the
# default category or valid_from mints a new version.
#
# Credits are the unit of account and there is no conversion to money, so these
# numbers are chosen on their own merits rather than derived from a price. The
# scale is what decides whether a hub admin grants someone hundreds or millions
# of credits: at these rates a workspace burning a million CPU-seconds a month
# consumes about a thousand credits.
#
# The figures are illustrative, roughly proportional to AWS list prices, and are
# not authoritative.
#
# The categories are illustrative too. 'standard' is the default and must have a
# multiplier, because a workspace with no category assignment is priced under it.

pricing_policy:
  valid_from: "2025-01-01T00:00:00Z"
  default_category: standard
  reason: "Local development baseline"
  rates:
    - sku: cpu-seconds
      credits_per_unit: 0.001
    - sku: memory-gb-seconds
      credits_per_unit: 0.00013
    - sku: EFS-STORAGE-STD
      credits_per_unit: 0.00001
    - sku: AWS-S3-STORAGE
      credits_per_unit: 0.000001
    - sku: AWS-S3-API-CALLS
      credits_per_unit: 0.00004
    - sku: AWS-S3-DATA-TRANSFER-OUT-REGION
      credits_per_unit: 1
    - sku: AWS-S3-DATA-TRANSFER-OUT-INTERREGION
      credits_per_unit: 2
    - sku: AWS-S3-DATA-TRANSFER-OUT-INTERNET
      credits_per_unit: 7
  category_multipliers:
    - category: standard
      multiplier: 1
    - category: academic
      multiplier: 0.5
