# Local development configuration, mounted at /etc/eodh/accounting.conf.
#
# This is the inner document only. The production equivalent lives inside a
# Kubernetes ConfigMap in eodhp-argocd-deployment, under data."accounting.conf"
# - mounting that file as-is gives a config with no 'items' key and a silent
# no-op load.
#
# Production also ships 'prices: []'. Prices are set here so that the pricing
# path is actually exercised locally. The figures are illustrative, roughly
# derived from AWS list prices in pounds per unit, and are not authoritative.

items:
  - sku: cpu-seconds
    name: Notebook and workflow CPU time
    unit: "s"
  - sku: memory-gb-seconds
    name: Notebook and workflow memory
    unit: "GB-s"
  - sku: EFS-STORAGE-STD
    name: Standard block storage
    unit: "GB-s"
  - sku: AWS-S3-STORAGE
    name: Standard object storage
    unit: "GB-s"
  - sku: AWS-S3-API-CALLS
    name: Object store S3 API calls
    unit: "requests"
  - sku: AWS-S3-DATA-TRANSFER-OUT-REGION
    name: Object store S3 data transfer to AWS eu-west-2
    unit: "GB"
  - sku: AWS-S3-DATA-TRANSFER-OUT-INTERREGION
    name: Object store S3 data transfer to other AWS regions
    unit: "GB"
  - sku: AWS-S3-DATA-TRANSFER-OUT-INTERNET
    name: Object store S3 data transfer to the Internet
    unit: "GB"

prices:
  - sku: cpu-seconds
    valid_from: "2025-01-01T00:00:00Z"
    price: 0.00001
  - sku: memory-gb-seconds
    valid_from: "2025-01-01T00:00:00Z"
    price: 0.0000013
  - sku: EFS-STORAGE-STD
    valid_from: "2025-01-01T00:00:00Z"
    price: 0.0000001
  - sku: AWS-S3-STORAGE
    valid_from: "2025-01-01T00:00:00Z"
    price: 0.00000001
  - sku: AWS-S3-API-CALLS
    valid_from: "2025-01-01T00:00:00Z"
    price: 0.0000004
  - sku: AWS-S3-DATA-TRANSFER-OUT-REGION
    valid_from: "2025-01-01T00:00:00Z"
    price: 0.01
  - sku: AWS-S3-DATA-TRANSFER-OUT-INTERREGION
    valid_from: "2025-01-01T00:00:00Z"
    price: 0.02
  - sku: AWS-S3-DATA-TRANSFER-OUT-INTERNET
    valid_from: "2025-01-01T00:00:00Z"
    price: 0.07
