[project]
name = "accounting-service"
dynamic = ["version"]
description = "A service which receives, records and serves accounting and price information in EODH"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
authors = [
    { name = "Telespazio UK Ltd", email = "alex.hayward@telespazio.com" }
]
maintainers = [
    { name = "Telespazio UK Ltd", email = "alex.hayward@telespazio.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "pulsar-client",
    "fastapi[standard]",
    "psycopg[binary,pool]",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "click",
    "opentelemetry-instrumentation-fastapi",
    "pyjwt",
    "eodhp-utils",
    "pyyaml",
    "rich",
    "rich-click",
    "sqlmodel>=0.0.42",
    "pyrefly>=0.60.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-mock",
    "pytest-watcher",
    "pytest-xdist",
    "ruff",
    "validate-pyproject",
    "faker",
    "httpx2",
    "testcontainers[postgres]",
    "debugpy>=1.8.21",
]

[project.urls]
homepage = "https://github.com/EO-DataHub/"
repository = "https://github.com/EO-DataHub/accounting-service"
changelog = "https://github.com/EO-DataHub/accounting-service/blob/main/CHANGELOG.md"

[project.scripts]
inject = "dev.inject:cli"
billing-admin = "dev.billing_admin:cli"

[tool.pyright]
# Stated explicitly rather than inherited from whatever a given pyright release defaults to,
# so upgrading the tool cannot quietly change what is checked.
include = ["accounting_service", "tests", "dev", "alembic"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

# Resolve imports against the project venv. Without this an editor running its own pyright
# reports every third-party import as unresolved, which buries the diagnostics that matter.
venvPath = "."
venv = ".venv"

# There are no rule overrides for accounting_service on purpose. Where pyright cannot check
# something - SQLModel query expressions, mainly - the suppression sits in the file that needs
# it, with the reason next to it. See the header of accounting_service/models.py. A rule turned
# off for the whole project would apply to code nobody had thought about.
#
# The package is clean under the settings above, and stays held to them.
#
# These two rules are turned off for the supporting code instead, scoped by directory rather
# than project-wide. Both fire on the same third-party cause: eodhp_utils declares its Pulsar
# message classes with pulsar.schema field descriptors, so reading `message.sku` is a `String`
# to a type checker and never a `str`, and assigning to one is reported as writing to a
# read-only attribute. There is no fix available from this repository and there are twenty of
# them.
#
# "none" rather than "warning" because a warning on correct code is noise in an editor, and
# noise gets filtered wholesale. The cost is that a genuine argument-type mistake in a test or
# a dev script goes unreported. If that stops being an acceptable trade, the tighter mechanism
# is a `# pyright: reportArgumentType=false` header in the five files that touch Pulsar
# messages - dev/inject.py, tests/integration/conftest.py, test_messager.py, test_models.py and
# test_consumption_rate_sample_processing.py - and deleting both blocks below.
#
# alembic has no execution environment. It used to need one for
# `sqlmodel.sql.sqltypes.AutoString` in autogenerated revisions, which is fixed properly in
# alembic/script.py.mako by importing the submodule rather than the package.
#
# This replaced a pyrightconfig.json holding the same two rules with no directory scope and no
# explanation. Pyright loads pyrightconfig.json in preference to pyproject.toml when both
# exist, so everything above was inert while that file was present.

[[tool.pyright.executionEnvironments]]
root = "tests"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"

[[tool.pyright.executionEnvironments]]
root = "dev"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"

# Last, and without overrides, so it does not shadow the two above.
[[tool.pyright.executionEnvironments]]
root = "accounting_service"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.uv]
package = true

[tool.uv.sources]
eodhp-utils = { git = "https://github.com/UKEODHP/eodhp-utils", tag = "v0.1.15" }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "E", # Pycodestyle errors
    "W", # Pycodestyle warnings
    "F", # Pyflakes
    "I", # isort
    "FAST", # FastAPI
    "RUF", # RUF-specific rules
    "SIM", # Simplifications
    "B", # Bugbear
    "ANN", # Annotations
    "PLC", # Pylint convention
    "PLE", # Pylint errors
    "UP", # pyupgrade
    "FURB", # refurb
    "PT", # pytest
]
ignore = [
    "E501", # line too long
    "SIM108", # ternary operator
    "SIM103", # return bool directly
    "B008"    # function call in default argument (incompatible with FastAPI)
]
